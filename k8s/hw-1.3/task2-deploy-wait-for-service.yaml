apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-after-service
  labels:
    app: nginx-after-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-after-service
  template:
    metadata:
      labels:
        app: nginx-after-service
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for nginx-after-service DNS record..."
              until nslookup nginx-after-service.default.svc.cluster.local.; do
                echo "Service is not available yet"
                sleep 5
              done
              echo "Service is available"
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
