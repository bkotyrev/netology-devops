apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content # ИЗМЕНИТЕ: Укажите имя ConfigMap
  namespace: default # ОПЦИОНАЛЬНО: Укажите namespace, если не default
data:
  # КЛЮЧЕВОЙ МОМЕНТ: index.html будет подключен как файл
  index.html: |
    <!DOCTYPE html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <!-- ИЗМЕНИТЕ: Заголовок страницы -->
      <title>Страница из ConfigMap</title>
    </head>
    <body>
      <!-- ДОБАВЬТЕ: Свой контент страницы -->
      <h1>Привет от Kubernetes!</h1>
      <p>Эта страница подключена через ConfigMap web-content.</p>
    </body>
    </html>
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location / {
        try_files $uri $uri/ =404;
      }
    }
