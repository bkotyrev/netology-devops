---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-exchange-pv # ДОПОЛНИТЕ: Имя хранилища
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /tmp/k8s-hw-2.1/pv-data # КЛЮЧЕВОЕ: Путь к директории на ноде (хосте, на котором развёрнут кластер)
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-exchange-pvc # ДОПОЛНИТЕ: Имя PVC
spec:
  volumeName: data-exchange-pv # ДОПОЛНИТЕ: Имя PV, к которому будет привязан PVC, должен совпадать с созданным ранее PV
  storageClassName: ""
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi # ДОПОЛНИТЕ: Какой объём хранилища вы хотите передать в контейнер. Должно быть меньше или равно параметру storage из PV
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1 # ЗАДАНИЕ: Укажите количество реплик
  selector:
    matchLabels:
      app: data-exchange-pvc # ДОПОЛНИТЕ: Метка для селектора
  template:
    metadata:
      labels:
        app: data-exchange-pvc # ПОВТОРИТЕ: Метка из selector.matchLabels
    spec:
      containers:
      - name: writer # ДОПОЛНИТЕ: Имя первого контейнера
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args: ['while true; do echo "$(date)" >> /shared/data.txt; sleep 5; done'] # КЛЮЧЕВОЕ: Команда записи данных в файл в директории из секции volumeMounts контейнера
        volumeMounts:
        - name: persistent-data # ДОПОЛНИТЕ: Имя монтируемого раздела. Должно совпадать с именем хранилища, объявленного на уровне пода
          mountPath: /shared # КЛЮЧЕВОЕ: Путь монтирования хранилища внутри контейнера 1
      - name: reader # ДОПОЛНИТЕ: Имя второго контейнера
        image: wbitt/network-multitool:latest
        command: ["/bin/sh", "-c"]
        args: ['touch /shared/data.txt; exec tail -f /shared/data.txt'] # КЛЮЧЕВОЕ: Команда для чтения данных из файла, расположенного в директории, указанной в volumeMounts контейнера
        volumeMounts:
        - name: persistent-data # ДОПОЛНИТЕ: Имя монтируемого раздела. Должно совпадать с именем хранилища, объявленного на уровне пода
          mountPath: /shared # КЛЮЧЕВОЕ: Путь монтирования хранилища внутри контейнера 2
      volumes:
      - name: persistent-data # ДОПОЛНИТЕ: Имя монтируемого раздела хранилища
        persistentVolumeClaim:
          claimName: data-exchange-pvc # КЛЮЧЕВОЕ: Совпадает с именем PVC объявленного ранее
