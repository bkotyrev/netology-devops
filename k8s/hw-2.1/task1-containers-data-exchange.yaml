apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
spec:
  replicas: 1 # ЗАДАНИЕ: Укажите количество реплик
  selector:
    matchLabels:
      app: data-exchange # ДОПОЛНИТЕ: Метка для селектора
  template:
    metadata:
      labels:
        app: data-exchange # ПОВТОРИТЕ: Метка из selector.matchLabels
    spec:
      containers:
      - name: writer # ДОПОЛНИТЕ: Имя первого контейнера
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args: ['while true; do echo "$(date)" >> /shared/data.txt; sleep 5; done'] # КЛЮЧЕВОЕ: Команда записи данных в файл в директории из секции volumeMounts контейнера
        volumeMounts:
        - name: shared-data # ДОПОЛНИТЕ: Имя монтируемого раздела. Должно совпадать с именем эфемерного хранилища, объявленного на уровне пода.
          mountPath: /shared # КЛЮЧЕВОЕ: Путь монтирования эфемерного хранилища внутри контейнера 1
      
      - name: reader # ДОПОЛНИТЕ: Имя второго контейнера
        image: wbitt/network-multitool:latest
        command: ["/bin/sh", "-c"]
        args: ['touch /shared/data.txt; exec tail -f /shared/data.txt'] # КЛЮЧЕВОЕ: Команда для чтения данных из файла, расположенного в директории, указанной в volumeMounts контейнера
        volumeMounts:
        - name: shared-data # ДОПОЛНИТЕ: Имя монтируемого раздела. Должно совпадать с именем эфемерного хранилища, объявленного на уровне пода
          mountPath: /shared # КЛЮЧЕВОЕ: Путь монтирования эфемерного хранилища внутри контейнера 2
      
      volumes:
      - name: shared-data # ДОПОЛНИТЕ: Имя монтируемого раздела эфемерного хранилища
        emptyDir: {} # ИНФОРМАЦИЯ: Определяем эфемерное хранилище, которое работает только внутри пода
