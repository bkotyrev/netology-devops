apiVersion: v1
kind: Service
metadata:
  name: nginx-multitool
  labels:
    app: nginx-multitool
spec:
  type: ClusterIP
  selector:
    app: nginx-multitool
  ports:
    - name: nginx-9001
      protocol: TCP
      port: 9001
      targetPort: nginx-http
    - name: multitool-9002
      protocol: TCP
      port: 9002
      targetPort: multitool-http
