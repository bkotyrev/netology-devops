apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-nginx-backend
spec:
  ingressClassName: public
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-multitool
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-nginx
                port:
                  name: http
