---
vector_version: 0.54.0
vector_deb_url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector_{{ vector_version }}-1_amd64.deb"
vector_deb_path: "/tmp/vector_{{ vector_version }}_amd64.deb"
vector_rpm_url: "https://github.com/vectordotdev/vector/releases/download/v{{ vector_version }}/vector-{{ vector_version }}-1.x86_64.rpm"
vector_rpm_path: "/tmp/vector-{{ vector_version }}-1.x86_64.rpm"
vector_config_path: /etc/vector/vector.yaml
vector_data_dir: /var/lib/vector
vector_sources:
  demo:
    type: demo_logs
    format: syslog
    interval: 1
vector_sinks:
  console:
    type: console
    inputs:
      - demo
    encoding:
      codec: json
