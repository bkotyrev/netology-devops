---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: oraclelinux-8
    image: docker.io/library/oraclelinux:8
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy