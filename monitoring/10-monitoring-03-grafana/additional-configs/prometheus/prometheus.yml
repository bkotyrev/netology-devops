global:
  scrape_interval: 30s
  external_labels:
    cluster: monitoring-main
    replica: prometheus-2

alerting:
  alert_relabel_configs:
    - action: labeldrop
      regex: replica

  alertmanagers:
    - static_configs:
        - targets:
            - 192.0.2.11:9093
            - 192.0.2.10:9093


scrape_configs:
  - job_name: node
    static_configs:
      - targets:
          - node-01.example.lan:9100
          - node-02.example.lan:9100

  - job_name: smartctl_exporter
    static_configs:
      - targets:
          - node-01.example.lan:9633
          - node-02.example.lan:9633
    metric_relabel_configs:
      - source_labels: [device]
        regex: 'bus_0_sat\+megaraid_.*'
        action: drop

rule_files:
  - /etc/prometheus/rules/*.yml
